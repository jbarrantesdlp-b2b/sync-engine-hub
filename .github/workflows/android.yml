name: Android CI Compilation

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno limpio de Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Conceder permisos de ejecución al Wrapper de Gradle
      run: chmod +x gradlew

    - name: Compilar APK nativo sin restricciones locales
      run: ./gradlew -p android-widget assembleDebug

    - name: Exportar e instanciar el binario APK resultante
      uses: actions/upload-artifact@v4
      with:
        name: sync-engine-debug-apk
        path: |
          android-widget/app/build/outputs/apk/debug/*.apk
          android-widget/build/outputs/apk/debug/*.apk
